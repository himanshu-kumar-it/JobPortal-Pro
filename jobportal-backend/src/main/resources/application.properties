spring.application.name=jobportal-backend

# MySQL: override these with environment variables if your local credentials differ.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:himanshu@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates project tables without deleting existing records.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}

# Replace via JWT_SECRET in environments outside local development.
jwt.secret=${JWT_SECRET:JobPortalSecretKeyForJwtAuthentication2026JobPortalSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}
